<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="960" height="700" fill="#eef2f7"/>
  <rect x="40" y="32" width="880" height="636" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="72" y="84" font-size="24" font-weight="700" fill="#0f172a">Create manual return</text>
  <text x="72" y="108" font-size="13" fill="#64748b">Match the items to a nonprofit, then create a shipping label or schedule a pickup.</text>

  <text x="72" y="148" font-size="14" font-weight="700" fill="#313bac">Customer</text>

  <text x="72" y="170" font-size="11" fill="#64748b">Name</text>
  <rect x="72" y="176" width="256" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="86" y="199" font-size="14" fill="#0f172a">Jordan Ellis</text>

  <text x="352" y="170" font-size="11" fill="#64748b">Email</text>
  <rect x="352" y="176" width="256" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="366" y="199" font-size="14" fill="#0f172a">jordan.ellis@example.com</text>

  <text x="632" y="170" font-size="11" fill="#64748b">Phone</text>
  <rect x="632" y="176" width="256" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="646" y="199" font-size="14" fill="#0f172a">(555) 010-0142</text>

  <text x="72" y="236" font-size="11" fill="#64748b">Street address</text>
  <rect x="72" y="242" width="256" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="86" y="265" font-size="14" fill="#0f172a">123 Market Street</text>

  <text x="352" y="236" font-size="11" fill="#64748b">City</text>
  <rect x="352" y="242" width="256" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="366" y="265" font-size="14" fill="#0f172a">Austin</text>

  <text x="632" y="236" font-size="11" fill="#64748b">State and ZIP</text>
  <rect x="632" y="242" width="256" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="646" y="265" font-size="14" fill="#0f172a">TX  78701</text>

  <text x="72" y="318" font-size="14" font-weight="700" fill="#313bac">Items</text>

  <text x="72" y="340" font-size="11" fill="#64748b">Item</text>
  <text x="324" y="340" font-size="11" fill="#64748b">Category</text>
  <text x="506" y="340" font-size="11" fill="#64748b">Qty</text>
  <text x="588" y="340" font-size="11" fill="#64748b">Value</text>
  <text x="710" y="340" font-size="11" fill="#64748b">Weight</text>

  <rect x="72" y="346" width="240" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="86" y="369" font-size="14" fill="#0f172a">Linen shirt</text>
  <rect x="324" y="346" width="170" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="338" y="369" font-size="14" fill="#0f172a">Apparel</text>
  <rect x="506" y="346" width="70" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="520" y="369" font-size="14" fill="#0f172a">2</text>
  <rect x="588" y="346" width="110" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="602" y="369" font-size="14" fill="#0f172a">$48.00</text>
  <rect x="710" y="346" width="110" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="724" y="369" font-size="14" fill="#0f172a">1.2 lb</text>

  <rect x="72" y="392" width="240" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="86" y="415" font-size="14" fill="#0f172a">Rain jacket</text>
  <rect x="324" y="392" width="170" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="338" y="415" font-size="14" fill="#0f172a">Outerwear</text>
  <rect x="506" y="392" width="70" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="520" y="415" font-size="14" fill="#0f172a">1</text>
  <rect x="588" y="392" width="110" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="602" y="415" font-size="14" fill="#0f172a">$89.00</text>
  <rect x="710" y="392" width="110" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="724" y="415" font-size="14" fill="#0f172a">2.4 lb</text>

  <text x="72" y="456" font-size="13" font-weight="600" fill="#313bac">+ Add item</text>
  <text x="888" y="456" font-size="13" text-anchor="end" fill="#15803d">Total weight 4.8 lb of the 70 lb shipping limit</text>

  <text x="72" y="500" font-size="11" fill="#64748b">RMA ID</text>
  <rect x="72" y="506" width="256" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="86" y="529" font-size="14" fill="#0f172a">RMA-10428</text>

  <text x="352" y="500" font-size="11" fill="#64748b">Return reason</text>
  <rect x="352" y="506" width="536" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="366" y="529" font-size="14" fill="#0f172a">Wrong size</text>

  <text x="72" y="578" font-size="11" fill="#64748b">Return method</text>
  <rect x="72" y="584" width="300" height="40" rx="10" fill="#eef2f7"/>
  <rect x="76" y="588" width="146" height="32" rx="7" fill="#ffffff" stroke="#313bac" stroke-width="1.5"/>
  <text x="149" y="609" font-size="13" font-weight="600" text-anchor="middle" fill="#313bac">Print label</text>
  <text x="297" y="609" font-size="13" text-anchor="middle" fill="#64748b">Schedule pickup</text>
  <text x="392" y="609" font-size="12" fill="#64748b">Label through EasyPost. Pickup through FedEx.</text>

  <rect x="728" y="584" width="160" height="40" rx="9" fill="#313bac"/>
  <text x="808" y="609" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Create return</text>
</svg>
